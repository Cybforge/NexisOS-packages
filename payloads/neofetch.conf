# NexisOS classic theme. Detection and formatting use upstream Neofetch.
print_info() {
    # prin() keeps the ordinary space after its colon. Position that space
    # one column before the aligned values, relative to the measured logo.
    if [[ $stdout != on ]]; then
        # An unknown upstream distro has no text palette; apply our theme
        # after distro-logo detection has finished.
        set_text_colors 4 6 5
        separator=":\e[$((text_padding + 10))G"
    fi
    info title
    info underline
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    prin "Desktop" "NexisOS Desktop"
    info "Shell" shell
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory
    info cols
}

image_backend="ascii"
image_source="/usr/share/nexis/brand/neofetch.txt"
ascii_colors=(4 6 5 4 6 5)
ascii_bold="on"
gap=4
colors=(6 7 7 4 7 7)
bold="on"
underline_enabled="on"
color_blocks="on"
block_width=3
block_height=1
block_range=(0 15)
col_offset="auto"
distro_shorthand="off"
os_arch="off"
kernel_shorthand="off"
shell_path="off"
shell_version="off"
memory_percent="on"
stdout="off"
